apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: demo-app-secrets
  namespace: demo
spec:
  provider: aws
  parameters:
    usePodIdentity: "false"
    region: us-east-1
    objects: |
      - objectName: "demo/app"
        objectType: "secretsmanager"
        objectAlias: "app-config"
